<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>페이지를 찾을 수 없습니다 | 체대생의 스포츠 바이브코딩</title>
  <link rel="stylesheet" href="/assets/site.css">
  <script>
    (function () {
      var p = location.pathname;
      if (p === "/sports-vibe-column" || p === "/sports-vibe-column/") {
        location.replace("/");
      } else if (p.indexOf("/sports-vibe-column/") === 0) {
        location.replace(p.replace("/sports-vibe-column", "") + location.search + location.hash);
      }
    })();
  </script>
</head>
<body>
  <main style="max-width:760px;margin:12vh auto;padding:32px 24px;text-align:center;font-family:Arial,sans-serif">
    <h1>찾는 페이지가 없습니다.</h1>
    <p>주소가 변경되었거나 존재하지 않는 페이지입니다.</p>
    <p><a href="/">홈으로 돌아가기 →</a></p>
  </main>
</body>
</html>
